name: Traduzir comentários

# Dispara quando tools/request.txt muda (ou manualmente, na aba Actions).
on:
  push:
    paths: ["tools/request.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: traduzir-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.p.outputs.books }}
      total: ${{ steps.p.outputs.total }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          books=$(grep -E '^books=' tools/request.txt | head -1 | cut -d= -f2 | tr -d ' \r')
          total=$(grep -E '^shards=' tools/request.txt | head -1 | cut -d= -f2 | tr -d ' \r')
          case "$total" in ''|*[!0-9]*) total=4;; esac
          [ "$total" -gt 20 ] && total=20
          [ "$total" -lt 1 ] && total=1
          [ -z "$books" ] && books=john
          echo "books=$books" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "matrix=[$(seq -s, 0 $((total-1)))]" >> "$GITHUB_OUTPUT"

  traduzir:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plano.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install argostranslate
      - name: Traduzir
        env:
          BOOKS: ${{ needs.plano.outputs.books }}
          TOTAL: ${{ needs.plano.outputs.total }}
        run: |
          mkdir -p out/tr out/logs
          python tools/translate.py ${{ matrix.shard }} "$TOTAL" "$BOOKS" 320 2>&1 | tee out/logs/lote-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tr-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  reunir:
    needs: traduzir
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: baixado
          pattern: tr-*
          merge-multiple: true
      - name: Gravar no repositório
        run: |
          mkdir -p docs/tr tools/logs
          [ -d baixado/tr ] && cp -f baixado/tr/*.json docs/tr/ 2>/dev/null || true
          [ -d baixado/logs ] && cp -f baixado/logs/*.log tools/logs/ 2>/dev/null || true
          rm -rf baixado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tr tools/logs
          if git diff --cached --quiet; then echo "nada novo"; echo "novo=0" >> "$GITHUB_ENV"; exit 0; fi
          git commit -m "Traduções automáticas (rodada ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 15; done
          echo "novo=1" >> "$GITHUB_ENV"
      - name: Continuar se ainda falta traduzir
        if: env.novo == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          falta=$(python3 - <<'PY'
          import glob, json, os, re
          books = "john"
          for line in open("tools/request.txt"):
              if line.startswith("books="):
                  books = line.split("=", 1)[1].strip().lower()
          files = [f for f in glob.glob("docs/data/*.json") if re.search(r"-\d+\.json$", f)]
          if books != "all":
              want = set(b.strip() for b in books.split(","))
              files = [f for f in files if os.path.basename(f).rsplit("-", 1)[0] in want]
          n = 0
          for f in files:
              t = os.path.join("docs/tr", os.path.basename(f))
              if not os.path.exists(t) or '"_partial":true' in open(t, encoding="utf-8").read()[-40:]:
                  n += 1
          print(n)
          PY
          )
          echo "arquivos ainda por traduzir: $falta"
          if [ "$falta" -gt 0 ]; then gh workflow run translate.yml --ref "${{ github.ref_name }}"; fi
